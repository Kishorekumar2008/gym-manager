{% extends "member_base.html" %}
{% block content %}
<div class="page-title">📋 Select Your Plan</div>
<form method="POST">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px">
        {% for key, plan in plans.items() %}
        <label style="cursor:pointer">
            <input type="radio" name="membership" value="{{ key }}" style="display:none" class="plan-radio">
            <div class="card plan-card" style="text-align:center;transition:all 0.2s;{% if key == 'half_yearly' %}border-color:rgba(245,158,11,0.5){% endif %}">
                {% if key == 'half_yearly' %}<div style="background:var(--gold);color:#000;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px;font-family:'Syne',sans-serif">POPULAR</div>{% endif %}
                <div style="font-size:28px;margin-bottom:8px">
                    {% if key == 'monthly' %}🗓️
                    {% elif key == 'quarterly' %}📆
                    {% elif key == 'half_yearly' %}⭐
                    {% else %}🏆{% endif %}
                </div>
                <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;margin-bottom:6px">{{ plan.label }}</div>
                <div style="font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--accent)">₹{{ plan.fee }}</div>
                {% if key == 'monthly' %}
                <div style="font-size:11px;color:var(--gold);margin-top:4px">+ ₹200 admission (first time)</div>
                {% endif %}
                <div style="font-size:11px;color:var(--muted);margin-top:4px">{{ plan.days }} days validity</div>
            </div>
        </label>
        {% endfor %}
    </div>
    <button type="submit" class="add-btn">Proceed to Payment →</button>
</form>
<script>
document.querySelectorAll('.plan-radio').forEach(radio => {
    radio.addEventListener('change', function(){
        document.querySelectorAll('.plan-card').forEach(c => c.style.borderColor = 'rgba(124,58,237,0.2)');
        this.closest('label').querySelector('.plan-card').style.borderColor = '#7c3aed';
        this.closest('label').querySelector('.plan-card').style.boxShadow = '0 0 20px rgba(124,58,237,0.3)';
    });
});
</script>
{% endblock %}
