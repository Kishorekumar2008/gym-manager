<!DOCTYPE html>
<html>
<head>
    <title>🏋️ Golden Gym — Member Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0f;--surface:#12121a;--accent:#7c3aed;--accent2:#06b6d4;--text:#f1f5f9;--muted:#64748b;--border:rgba(124,58,237,0.2);--red:#ef4444;--green:#10b981}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:420px;animation:fadeUp 0.5s ease}
        .logo{text-align:center;margin-bottom:24px}
        .logo-icon{font-size:40px;margin-bottom:8px}
        .logo-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo-sub{color:var(--muted);font-size:13px;margin-top:4px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
        .form-group input{width:100%;padding:11px 14px;background:#1a1a26;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
        .form-group input:focus{border-color:var(--accent)}
        .btn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#4f46e5);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;transition:opacity 0.2s}
        .btn:hover{opacity:0.85}
        .error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red);padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px;text-align:center}
        .success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green);padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px;text-align:center}
        .forgot{text-align:center;margin-top:12px;font-size:12px;color:var(--muted)}
        .link{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
        .link a{color:var(--accent2);text-decoration:none}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>
<div class="box">
    <div class="logo">
        <div class="logo-icon">🏋️</div>
        <div class="logo-name">Golden Gym</div>
        <div class="logo-sub">Member Portal</div>
    </div>
    {% if success %}<div class="success">✅ Account created! Please sign in.</div>{% endif %}
    {% if error %}<div class="error">❌ {{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn">Sign In 💪</button>
    </form>
    <div class="forgot">Forgot password? Contact the gym owner.</div>
    <div class="link">New member? <a href="/member/register">Create Account</a></div>
</div>
</body>
</html>
