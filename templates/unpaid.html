{% extends "base.html" %}
{% block content %}
<h1>⚠️ Unpaid Members</h1>
<div class="card">
    <h2>Total Pending: ₹{{ total_pending }}</h2>
    <table>
        <tr><th>ID</th><th>Name</th><th>Phone</th><th>Membership</th><th>Fee Due</th><th>Action</th></tr>
        {% for m in unpaid %}
        <tr>
            <td>{{ m.id }}</td>
            <td>{{ m.name }}</td>
            <td>{{ m.phone }}</td>
            <td>{{ m.membership_type }}</td>
            <td class="unpaid">₹{{ m.fee }}</td>
            <td><a href="/mark_paid/{{ m.id }}" class="btn btn-green">Mark Paid</a></td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
