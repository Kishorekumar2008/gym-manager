<!DOCTYPE html>
<html>
<head>
    <title>🏋️ Gym Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; }
        .navbar {
            background: #16213e;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 2px solid #e94560;
        }
        .navbar a {
            color: #eee;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .navbar a:hover { background: #e94560; }
        .navbar .brand { font-size: 20px; font-weight: bold; color: #e94560; margin-right: 20px; }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .card h2 { color: #e94560; margin-bottom: 15px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid #0f3460;
        }
        .stat-card .number { font-size: 36px; font-weight: bold; color: #e94560; }
        .stat-card .label { color: #aaa; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #0f3460; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #0f3460; }
        tr:hover { background: #0f3460; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }
        .btn-green { background: #27ae60; color: white; }
        .btn-red { background: #e94560; color: white; }
        .btn-blue { background: #2980b9; color: white; }
        .btn:hover { opacity: 0.8; }
        .paid { color: #27ae60; font-weight: bold; }
        .unpaid { color: #e94560; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid #e94560;
            border-radius: 5px;
            color: #eee;
            font-size: 16px;
        }
        h1 { color: #e94560; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="brand">🏋️ GymManager</span>
        <a href="/">🏠 Dashboard</a>
        <a href="/members">👥 Members</a>
        <a href="/attendance">📅 Attendance</a>
        <a href="/finance">💰 Finance</a>
        <a href="/expenses">📉 Expenses</a>
        <a href="/unpaid">⚠️ Unpaid</a>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
