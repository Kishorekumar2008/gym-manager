<!DOCTYPE html>
<html>
<head>
    <title>🏋️ Golden Gym Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;
            --accent:#7c3aed;--accent2:#06b6d4;--gold:#f59e0b;
            --green:#10b981;--red:#ef4444;--text:#f1f5f9;--muted:#64748b;
            --border:rgba(124,58,237,0.2)
        }
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
        .navbar{
            display:flex;align-items:center;gap:6px;padding:14px 28px;
            background:rgba(18,18,26,0.97);border-bottom:1px solid var(--border);
            position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)
        }
        .brand{
            font-family:'Syne',sans-serif;font-weight:800;font-size:20px;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:16px
        }
        .nav-item{
            padding:8px 14px;border-radius:8px;font-size:13px;color:var(--muted);
            text-decoration:none;transition:all 0.2s;font-family:'DM Sans',sans-serif
        }
        .nav-item:hover{background:rgba(124,58,237,0.15);color:var(--text)}
        .nav-active{background:rgba(124,58,237,0.15);color:var(--text)}
        .container{padding:28px;max-width:1200px;margin:0 auto}
        .card{
            background:var(--surface);border:1px solid var(--border);
            border-radius:16px;padding:22px;margin-bottom:20px
        }
        .page-title{
            font-family:'Syne',sans-serif;font-size:24px;font-weight:800;
            margin-bottom:20px;display:flex;align-items:center;gap:10px
        }
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
        .stat-card{
            background:var(--surface);border:1px solid var(--border);border-radius:14px;
            padding:18px;position:relative;overflow:hidden;
            transition:transform 0.2s,border-color 0.2s
        }
        .stat-card:hover{transform:translateY(-3px);border-color:var(--accent)}
        .stat-icon{font-size:22px;margin-bottom:10px}
        .stat-val{font-family:'Syne',sans-serif;font-size:28px;font-weight:800}
        .stat-label{font-size:12px;color:var(--muted);margin-top:4px}
        .green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.cyan{color:var(--accent2)}.purple{color:var(--accent)}
        table{width:100%;border-collapse:collapse}
        th{background:var(--surface2);padding:12px 16px;text-align:left;font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
        td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px}
        tr:last-child td{border-bottom:none}
        tr:hover td{background:rgba(124,58,237,0.05)}
        .badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
        .badge-green{background:rgba(16,185,129,0.15);color:var(--green)}
        .badge-red{background:rgba(239,68,68,0.15);color:var(--red)}
        .badge-gold{background:rgba(245,158,11,0.15);color:var(--gold)}
        .badge-cyan{background:rgba(6,182,212,0.15);color:var(--accent2)}
        .badge-purple{background:rgba(124,58,237,0.15);color:var(--accent)}
        .badge-warn{background:rgba(245,158,11,0.2);color:var(--gold)}
        .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.2s;text-decoration:none;display:inline-block}
        .btn-primary{background:var(--accent);color:#fff}
        .btn-primary:hover{background:#6d28d9}
        .btn-green{background:rgba(16,185,129,0.2);color:var(--green);border:1px solid rgba(16,185,129,0.3)}
        .btn-green:hover{background:rgba(16,185,129,0.35)}
        .btn-red{background:rgba(239,68,68,0.2);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
        .btn-red:hover{background:rgba(239,68,68,0.35)}
        .btn-gold{background:rgba(245,158,11,0.2);color:var(--gold);border:1px solid rgba(245,158,11,0.3)}
        .btn-gold:hover{background:rgba(245,158,11,0.35)}
        .add-btn{
            display:inline-flex;align-items:center;gap:6px;padding:10px 20px;
            border-radius:10px;background:linear-gradient(135deg,var(--accent),#4f46e5);
            color:#fff;border:none;cursor:pointer;font-family:'Syne',sans-serif;
            font-weight:700;font-size:13px;transition:all 0.2s;text-decoration:none
        }
        .add-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(124,58,237,0.4)}
        .form-group{margin-bottom:18px}
        .form-group label{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
        .form-group input,.form-group select{
            width:100%;padding:11px 14px;background:var(--surface2);
            border:1px solid var(--border);border-radius:10px;color:var(--text);
            font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s
        }
        .form-group input:focus,.form-group select:focus{border-color:var(--accent)}
        .form-group select option{background:var(--surface2)}
        .row-flex{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
        .section-divider{height:1px;background:var(--border);margin:20px 0}
        @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
        .fade-up{animation:fadeUp 0.5s ease}
        .warn-row td{background:rgba(245,158,11,0.05)!important}
        .hero{
            background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(6,182,212,0.06));
            border:1px solid var(--border);border-radius:20px;padding:24px 28px;
            margin-bottom:24px;position:relative;overflow:hidden
        }
        .hero-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800}
        .hero-sub{color:var(--muted);font-size:13px;margin-top:4px}
        .live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
        .alert{padding:14px 18px;border-radius:12px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px}
        .alert-warn{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--gold)}
        .alert-red{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red)}
    </style>
</head>
<body>
<div class="navbar">
    <span class="brand">🏋️ Golden Gym</span>
    <a href="/" class="nav-item {% if request.path == '/' %}nav-active{% endif %}">🏠 Dashboard</a>
    <a href="/members" class="nav-item {% if request.path == '/members' %}nav-active{% endif %}">👥 Members</a>
    <a href="/attendance" class="nav-item {% if request.path == '/attendance' %}nav-active{% endif %}">📅 Attendance</a>
    <a href="/finance" class="nav-item {% if request.path == '/finance' %}nav-active{% endif %}">💰 Finance</a>
    <a href="/expenses" class="nav-item {% if request.path == '/expenses' %}nav-active{% endif %}">📉 Expenses</a>
    <a href="/unpaid" class="nav-item {% if request.path == '/unpaid' %}nav-active{% endif %}">⚠️ Unpaid</a>
    <a href="/inactive" class="nav-item {% if request.path == '/inactive' %}nav-active{% endif %}">🚫 Inactive</a>
    <a href="/plans" class="nav-item {% if request.path == '/plans' %}nav-active{% endif %}">📋 Plans</a>
</div>
<div class="container fade-up">
    {% block content %}{% endblock %}
</div>
</body>
</html>
