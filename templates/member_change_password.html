{% extends "member_base.html" %}
{% block content %}
<div class="page-title">🔑 Change Password</div>
<div class="card" style="max-width:440px">
    {% if error %}<div class="alert alert-red" style="margin-bottom:16px">❌ {{ error }}</div>{% endif %}
    {% if success %}<div class="alert" style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green);margin-bottom:16px">✅ {{ success }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Old Password</label>
            <input type="password" name="old_password" placeholder="Enter old password" required>
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" placeholder="Enter new password" required>
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm" placeholder="Repeat new password" required>
        </div>
        <button type="submit" class="add-btn">Change Password 🔐</button>
    </form>
</div>
{% endblock %}
