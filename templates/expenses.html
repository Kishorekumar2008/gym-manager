{% extends "base.html" %}
{% block content %}
<h1>📉 Expenses — {{ month }}</h1>
<a href="/add_expense" class="btn btn-red" style="margin-bottom:20px">+ Add Expense</a>
<div class="card">
    <h2>Total: ₹{{ total }}</h2>
    <table>
        <tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr>
        {% for r in records %}
        <tr>
            <td>{{ r.date }}</td>
            <td>{{ r.category }}</td>
            <td>{{ r.description }}</td>
            <td>₹{{ r.amount }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
