<!DOCTYPE html>
<html data-theme="dark">
<head>
    <title>Golden Gym — Owner Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--gold:#D4A017;--gold2:#F5C842;--red:#EF4444;--green:#22C55E}
        [data-theme="dark"]{--bg:#0D0D00;--surface:#1A1700;--surface2:#242100;--text:#FFF8E1;--muted:#A89060;--border:rgba(212,160,23,0.25)}
        [data-theme="light"]{--bg:#FFFDF0;--surface:#FFFFFF;--surface2:#FFF8DC;--text:#1A1200;--muted:#6B5A2A;--border:rgba(212,160,23,0.35)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:background 0.4s}
        .box{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:38px;width:100%;max-width:420px;animation:fadeUp 0.5s ease;position:relative;overflow:hidden}
        .shimmer{position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(212,160,23,0.06),transparent);animation:shimmer 4s infinite}
        @keyframes shimmer{0%{left:-100%}100%{left:200%}}
        .logo{text-align:center;margin-bottom:28px}
        .logo img{width:70px;height:70px;border-radius:50%;border:3px solid var(--gold);margin-bottom:12px;object-fit:cover}
        .logo-placeholder{width:70px;height:70px;border-radius:50%;border:3px solid var(--gold);margin:0 auto 12px;background:rgba(212,160,23,0.1);display:flex;align-items:center;justify-content:center;font-size:32px}
        .logo-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:var(--gold)}
        .logo-sub{color:var(--muted);font-size:12px;margin-top:4px;font-weight:300;letter-spacing:0.3px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
        .form-group input{width:100%;padding:12px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s}
        .form-group input:focus{border-color:var(--gold)}
        .btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--gold);color:#000;font-family:'Playfair Display',serif;font-weight:700;font-size:15px;cursor:pointer;transition:all 0.2s;margin-top:4px;letter-spacing:0.3px}
        .btn:hover{background:var(--gold2);box-shadow:0 4px 18px rgba(212,160,23,0.35)}
        .error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red);padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;text-align:center}
        .link{text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}
        .link a{color:var(--gold);text-decoration:none;font-weight:500}
        .theme-row{display:flex;justify-content:center;gap:6px;margin-top:18px}
        .theme-btn{padding:4px 12px;border-radius:14px;border:1px solid var(--border);cursor:pointer;font-size:11px;font-family:'Inter',sans-serif;background:none;color:var(--muted);transition:all 0.2s}
        .theme-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>
<div class="box">
    <div class="shimmer"></div>
    <div class="logo">
        <img src="/static/logo.png" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="logo">
        <div class="logo-placeholder" style="display:none">🏋️</div>
        <div class="logo-name">Golden Gym</div>
        <div class="logo-sub">Owner Portal · Sign In</div>
    </div>
    {% if error %}<div class="error">❌ {{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="link">Member? <a href="/member/login">Member Portal →</a></div>
    <div class="theme-row">
        <button class="theme-btn" onclick="setTheme('light')">☀️ Light</button>
        <button class="theme-btn active" onclick="setTheme('dark')">🌙 Dark</button>
        <button class="theme-btn" onclick="setTheme('auto')">⚙️ Auto</button>
<div class="footer" style="margin-top:20px;text-align:center;color:var(--muted);font-size:12px;font-weight:300">
    <div>📞 <a href="tel:8825558615" style="color:var(--gold);text-decoration:none">88255 58615</a> &nbsp;·&nbsp; ✉️ <a href="mailto:goldengym@gmail.com" style="color:var(--gold);text-decoration:none">goldengym@gmail.com</a></div>
    <div style="display:flex;justify-content:center;gap:12px;margin-top:6px">
        <a href="https://instagram.com/goldengym" target="_blank" style="color:var(--gold);text-decoration:none">📸 Instagram</a>
        <a href="https://wa.me/918825558615" target="_blank" style="color:var(--gold);text-decoration:none">💬 WhatsApp</a>
    </div>
</div>
    </div>
</div>
<script>
function setTheme(t){
    const html=document.documentElement;
    document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
    if(t==='auto'){
        html.setAttribute('data-theme',window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.querySelectorAll('.theme-btn')[2].classList.add('active');
    } else {
        html.setAttribute('data-theme',t);
        document.querySelectorAll('.theme-btn')[t==='light'?0:1].classList.add('active');
    }
    localStorage.setItem('gym-theme',t);
}
(function(){
    const s=localStorage.getItem('gym-theme')||'dark';
    if(s==='auto'){
        document.documentElement.setAttribute('data-theme',window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.querySelectorAll('.theme-btn')[2]?.classList.add('active');
    } else {
        document.documentElement.setAttribute('data-theme',s);
        document.querySelectorAll('.theme-btn')[s==='light'?0:1]?.classList.add('active');
    }
})();
</script>
</body>
</html>
