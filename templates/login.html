<!DOCTYPE html>
<html>
<head>
    <title>🏋️ Golden Gym — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0f;--surface:#12121a;--accent:#7c3aed;--accent2:#06b6d4;--text:#f1f5f9;--muted:#64748b;--border:rgba(124,58,237,0.2);--red:#ef4444}
        body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .login-box{
            background:var(--surface);border:1px solid var(--border);
            border-radius:20px;padding:40px;width:100%;max-width:420px;
            animation:fadeUp 0.5s ease
        }
        .logo{text-align:center;margin-bottom:28px}
        .logo-icon{font-size:48px;margin-bottom:10px}
        .logo-name{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo-sub{color:var(--muted);font-size:13px;margin-top:4px}
        .form-group{margin-bottom:18px}
        .form-group label{display:block;margin-bottom:6px;font-size:13px;color:var(--muted)}
        .form-group input{width:100%;padding:12px 16px;background:#1a1a26;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
        .form-group input:focus{border-color:var(--accent)}
        .login-btn{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#4f46e5);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;cursor:pointer;transition:opacity 0.2s;margin-top:6px}
        .login-btn:hover{opacity:0.85}
        .error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red);padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;text-align:center}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <div class="logo-icon">🏋️</div>
        <div class="logo-name">Golden Gym</div>
        <div class="logo-sub">Owner Portal — Sign In</div>
    </div>
    {% if error %}
    <div class="error">❌ {{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="login-btn">Sign In 🔐</button>
    </form>
</div>
</body>
</html>
